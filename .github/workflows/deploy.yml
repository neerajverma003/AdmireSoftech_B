name: Deploy AdmireSoftech Backend


on:
    push:
        branches:
            - main


jobs:
    deploy:
        name: Deploy to Production
        runs-on: ubuntu-latest

        steps:
            # Checkout the repository
            - name: Checkout code
              uses: actions/checkout@v4
            

            # Set up Node.js
            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                 node-version: '22'
                 cache: 'npm'

            
            # Install dependencies
            - name: insatall dependencies
              run: npm ci


             # deploy to production
            - name: Deploy to Production
              uses: appleboy/ssh-action@v1.2.2
              with:
                 host: ${{ secrets.EC2_HOST}}
                 username: ${{ secrets.EC2_USERNAME}}
                 key: ${{ secrets.EC2_SSH_KEY}}
                 script: |
                    set -e

                    echo "start deployment..."

                    # Load NVM and shell environment in non-interactive session
                    export NVM_DIR="$HOME/.nvm"
                    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                    [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
                    [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
                    export PATH="$PATH:/usr/local/bin:/usr/bin"

                    cd /home/ubuntu/AdmireSoftech_B

                    echo "Pulling latest changes from the repository..."
                    git fetch origin main

                    echo "resetting working directory to match the latest commit..."
                    git reset --hard origin/main

                    echo "Installing dependencies..."
                    npm ci --omit=dev || npm install --omit=dev

                    echo "reloading the pm2 process..."
                    pm2 reload api.as || pm2 restart api.as || pm2 start server.js --name api.as

                    echo "checking the status of the pm2 process..."
                    pm2 status api.as || pm2 status

                    echo "Deployment completed successfully!"